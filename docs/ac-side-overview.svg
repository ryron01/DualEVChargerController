<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Dual PZEM AC-side overview</title>
<desc id="d">Both PZEM voltage inputs tap L and N in parallel through a fuse, upstream of the relays. Each CT surrounds only the hot conductor to its own outlet, downstream of that outlet's relay.</desc>
<style>
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600;fill:#1b211d}.ts{font-size:12px;fill:#5b665f}
.box{fill:#f1efe8;stroke:#888780;stroke-width:0.8}.pz{fill:#e1f5ee;stroke:#0f6e56;stroke-width:0.8}.pzt{fill:#085041}.pzs{fill:#0f6e56}
.fu{fill:#faece7;stroke:#993c1d;stroke-width:0.8}.fut{fill:#712b13}
</style>
<rect width="680" height="510" fill="#ffffff"/>
<text class="ts" x="60" y="84">From fused / GFCI test feed</text>
<line x1="60" y1="100" x2="600" y2="100" stroke="#D85A30" stroke-width="2"/>
<text class="th" x="610" y="104">L</text>
<line x1="100" y1="330" x2="600" y2="330" stroke="#888780" stroke-width="2"/>
<text class="th" x="610" y="334">N</text>

<line x1="260" y1="100" x2="260" y2="130" stroke="#D85A30" stroke-width="2"/>
<rect class="box" x="210" y="130" width="100" height="40" rx="4"/><text class="th" x="260" y="155" text-anchor="middle">Relay A</text>
<line x1="260" y1="170" x2="260" y2="250" stroke="#D85A30" stroke-width="2"/>
<circle cx="260" cy="210" r="16" fill="none" stroke="#BA7517" stroke-width="3"/>
<text class="ts" x="236" y="214" text-anchor="end">CT A</text>
<rect class="box" x="200" y="250" width="120" height="44" rx="4"/><text class="th" x="260" y="277" text-anchor="middle">Outlet A</text>
<line x1="260" y1="294" x2="260" y2="330" stroke="#888780" stroke-width="2"/>
<path d="M276 210 L350 210 L350 370" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4"/>

<line x1="480" y1="100" x2="480" y2="130" stroke="#D85A30" stroke-width="2"/>
<rect class="box" x="430" y="130" width="100" height="40" rx="4"/><text class="th" x="480" y="155" text-anchor="middle">Relay B</text>
<line x1="480" y1="170" x2="480" y2="250" stroke="#D85A30" stroke-width="2"/>
<circle cx="480" cy="210" r="16" fill="none" stroke="#BA7517" stroke-width="3"/>
<text class="ts" x="456" y="214" text-anchor="end">CT B</text>
<rect class="box" x="420" y="250" width="120" height="44" rx="4"/><text class="th" x="480" y="277" text-anchor="middle">Outlet B</text>
<line x1="480" y1="294" x2="480" y2="330" stroke="#888780" stroke-width="2"/>
<path d="M496 210 L570 210 L570 370" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="80" y1="100" x2="80" y2="180" stroke="#D85A30" stroke-width="1.5"/>
<rect class="fu" x="45" y="180" width="70" height="36" rx="4"/><text class="th fut" x="80" y="203" text-anchor="middle">Fuse</text>
<path d="M80 216 L80 450 L480 450 L480 426" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<line x1="260" y1="450" x2="260" y2="426" stroke="#D85A30" stroke-width="1.5"/>
<line x1="240" y1="330" x2="240" y2="370" stroke="#888780" stroke-width="1.5"/>
<line x1="460" y1="330" x2="460" y2="370" stroke="#888780" stroke-width="1.5"/>
<rect class="pz" x="220" y="370" width="150" height="56" rx="8"/><text class="th pzt" x="295" y="394" text-anchor="middle">PZEM A</text><text class="ts pzs" x="295" y="413" text-anchor="middle">Modbus addr 0x01</text>
<rect class="pz" x="440" y="370" width="150" height="56" rx="8"/><text class="th pzt" x="515" y="394" text-anchor="middle">PZEM B</text><text class="ts pzs" x="515" y="413" text-anchor="middle">Modbus addr 0x02</text>
<line x1="60" y1="480" x2="90" y2="480" stroke="#D85A30" stroke-width="2"/><text class="ts" x="98" y="484">Hot</text>
<line x1="150" y1="480" x2="180" y2="480" stroke="#888780" stroke-width="2"/><text class="ts" x="188" y="484">Neutral</text>
<line x1="260" y1="480" x2="290" y2="480" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4"/><text class="ts" x="298" y="484">CT leads (to PZEM terminals 3–4)</text>
</svg>
